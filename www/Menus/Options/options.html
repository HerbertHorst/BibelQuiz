<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Einstellungen</title>
    <link rel="stylesheet" href="../../app.css" />
    <style>
      .settings-section {
        width: 100%;
        max-width: 40rem;
        margin-bottom: 2.5rem;
      }
      .catalog-info {
        color: #9dc4e7de;
        font-size: 1.5rem;
        text-align: left;
      }
      #settingsStatus {
        color: #9dc4e7de;
        font-size: 1.4rem;
        min-height: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container flex-column flex-center">
      <h1>Einstellungen</h1>

      <div class="settings-section flex-column flex-center">
        <a class="btn" href="./catalogs.html">Kataloge verwalten</a>
      </div>

      <div class="settings-section flex-column flex-center">
        <h3>Spiel-Einstellungen</h3>
        <label class="checkbox-container">
          <input type="checkbox" id="repeatWrongAnswers" />
          <span class="checkmark"></span>
          Falsche Fragen wiederholen
        </label>
        <p class="catalog-info" style="text-align: center;">
          Falsch beantwortete Fragen kommen zurück in den Pool. Der Punktestand
          wird dabei ausgeblendet.
        </p>
        <p class="btn" id="resetDifficulty">Schwierigkeitsstufen zurücksetzen</p>
        <p id="settingsStatus"></p>
      </div>

      <div class="settings-section flex-column flex-center">
        <p class="btn" id="resetCache">Spielstand zurücksetzen</p>
        <a class="smallbtn" href="../startPage.html">Menü</a>
      </div>
    </div>
    <script type="module" src="./options.js"></script>
  </body>
</html>
